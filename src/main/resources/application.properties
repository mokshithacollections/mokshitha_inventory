spring.application.name=mc_ims


# Every value below falls back to the local development setting, but can be
# overridden by an environment variable — which is how Render supplies them.
#   SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mc_ims}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.properties.hibernate.default_schema=${SPRING_DATASOURCE_SCHEMA:public}

spring.datasource.driver-class-name=org.postgresql.Driver



spring.jpa.hibernate.ddl-auto=update
# Keep SQL logging off — with hundreds of invoices it floods the console and
# drastically slows endpoints. Flip to true only for local debugging.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Bill photos are stored in the database (purchase_bill_photos.data / bytea),
# so they are shared across all machines pointing at the same DB.
# Allow reasonably large bill photos from phone cameras.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Render injects the port it wants the app to listen on as $PORT.
server.port=${PORT:8081}


# ============================================================
#  AUTHENTICATION
# ============================================================
# The first sign-in account, created ONLY when app_users is empty (see
# InitialUserSeeder). Changing these later does nothing to an existing account —
# use Change Password on the dashboard for that.
#
# On Render, set these as environment variables so the real credentials are
# never committed:
#   MOKSHITHA_AUTH_SEED_USERNAME
#   MOKSHITHA_AUTH_SEED_PASSWORD
mokshitha.auth.seed-username=${MOKSHITHA_AUTH_SEED_USERNAME:}
mokshitha.auth.seed-password=${MOKSHITHA_AUTH_SEED_PASSWORD:}
mokshitha.auth.seed-display-name=${MOKSHITHA_AUTH_SEED_DISPLAY_NAME:}

# Admin password for the Analysis / Purchases prompts and the late-return
# override. Separate from the login password on purpose: one shared sign-in
# account means this is what still separates billing from margins and costs.
mokshitha.admin.password=${MOKSHITHA_ADMIN_PASSWORD:}

# A full trading day. Sessions are invalidated on sign-out and on password change.
server.servlet.session.timeout=12h

# Cookie hardening. http-only keeps the session id away from JavaScript (so an
# injected script cannot steal it); same-site=lax blocks it being sent on
# cross-site POSTs. `secure` is left OFF by default so plain-http localhost
# still works — set SESSION_COOKIE_SECURE=true on Render, which is HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.name=MCIMSSESSION

